[project]
name = "trial-landscape"
version = "0.1.0"
description = "Natural-language research assistant over the ClinicalTrials.gov API v2, powered by Gemini function calling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.15.0",
    "httpx>=0.27.0",
    "prompt-toolkit>=3.0.50",
    "pyperclip>=1.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.scripts]
trial-landscape = "trial_landscape.repl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trial_landscape"]
